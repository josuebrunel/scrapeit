services:
  caddy:
    image: caddy:latest
    container_name: scrapeit-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      publisher:
        condition: service_started
      auth:
        condition: service_healthy
    networks:
      - scrapeit

  browser:
    container_name: scrapeit-browser
    image: chromedp/headless-shell
    networks:
      - scrapeit
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=3",
          "--spider",
          "http://localhost:9222/json/version",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ipfs:
    container_name: scrapeit-ipfs
    image: ipfs/go-ipfs
    environment:
      - IPFS_PATH=/data/ipfs
    networks:
      - scrapeit

  blockchain:
    container_name: scrapeit-blockchain
    image: romangzz/anvil
    environment:
      - CHAIN_ID=42
      - BALANCE=100
      - BLOCK_TIME=60
      - HOST=0.0.0.0
    volumes:
      - ./contract:/contract
    networks:
      - scrapeit

  db:
    image: postgres
    container_name: scrapeit-db
    env_file:
      - .env
    volumes:
      - scrapeit_db:/var/lib/postgresql/
      - ./init-scripts/db:/docker-entrypoint-initdb.d
    networks:
      - scrapeit
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/auth:v2.170.0
    container_name: scrapeit-auth
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - scrapeit
    post_start:
      - command:
          [
            "gotrue",
            "admin",
            "createuser",
            "--admin",
            "--confirm",
            "admin",
            "admin1234",
            "service_role",
          ]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health",
        ]
      timeout: 5s
      interval: 5s
      retries: 3

  publisher:
    container_name: scrapeit-publisher
    image: ghcr.io/josuebrunel/scrapeit-publisher:latest
    env_file:
      - .env
    networks:
      - scrapeit
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      ipfs:
        condition: service_started

  subscriber:
    container_name: scrapeit-subscriber
    image: ghcr.io/josuebrunel/scrapeit-subscriber:latest
    environment:
      - PUB_ROOT_PEERS=http://publisher:8080/
      - CDP_REMOTE=ws://browser:9222/
      - API_KEY=B8lLeX66OGgK4rL2am9NQQSOO2kU8MryHBOjSQGP6O0
    networks:
      - scrapeit
    depends_on:
      browser:
        condition: service_started

networks:
  scrapeit:

volumes:
  scrapeit_db:
  caddy_data:
  caddy_config:
