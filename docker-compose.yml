services:
  browser:
      container_name: scrapeit-browser
      image: chromedp/headless-shell
      ports:
        - "8387:9222"
      networks:
        - scrapeit
      healthcheck:
        test: ["CMD", "wget", "--no-verbose", "--tries=3", "--spider", "http://localhost:9222/json/version"]
        interval: 30s
        timeout: 5s
        retries: 3
      restart: unless-stopped
  ipfs:
    container_name: scrapeit-ipfs
    image: ipfs/go-ipfs
    ports:
      - 4001:4001/tcp
      - 4001:4001/udp
      - "8383:8080"
      - "8384:5001"
    environment:
      - IPFS_PATH=/data/ipfs
    networks:
      - scrapeit

  blockchain:
    container_name: scrapeit-blockchain
    image: romangzz/anvil
    ports:
      - "8385:8545"
    environment:
      - CHAIN_ID=42
      - BLOCK_TIME=60
      - ACCOUNTS=15
      - BALANCE=2000000
      - HOST=0.0.0.0
      - DISABLE_CODE_SIZE_LIMIT=true
      # - GAS_LIMIT=3000000000000000
      #- DISABLE_BLOCK_GAS_LIMIT=true
    volumes:
      - ./contract:/contract
    networks:
      - scrapeit
  db:
    image: postgres
    container_name: scrapeit-db
    env_file:
      - .env/db.env
    volumes:
      - scrapeit_db:/var/lib/postgresql/data
      - ./init-scripts/db:/docker-entrypoint-initdb.d
    ports:
      - "8382:5432"
    networks:
      - scrapeit
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10
  auth:
    image: supabase/auth:v2.170.0
    container_name: scrapeit-auth
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env/auth.env
    ports:
      - "8386:9999"
    networks:
      - scrapeit
    post_start:
      - command: ["gotrue", "admin", "createuser",  "--admin",  "--confirm", "${APP_ADMIN_EMAIL}",  "${APP_ADMIN_PASSWORD}", "service_role"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3

  dev:
    container_name: scrapeit-dev
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    env_file:
      - .env/server.env
    ports:
      - "8380:8080"
      - "8381:7654"
    volumes:
      - ./:/go/src/app/
    networks:
      - scrapeit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      blockchain:
        condition: service_started
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      ipfs:
        condition: service_started


  publisher:
    container_name: scrapeit-publisher
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      target: publisher
    env_file:
      - .env/server.env
    ports:
      - "8380:8080"
      - "8381:7654"
    networks:
      - scrapeit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy

  subscriber:
    container_name: scrapeit-subscriber
    build:
      context: .
      dockerfile: Dockerfile
      target: subscriber
    environment:
      - PUB_ROOT_PEERS=http://dev:8080/settings
      - ETH_PRIVATE_KEY=0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a
    networks:
      - scrapeit
    extra_hosts:
      - "host.docker.internal:host-gateway"
networks:
  scrapeit:

volumes:
  scrapeit_db:
