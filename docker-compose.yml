services:
  redis:
    container_name: scrapeit-redis
    image: redis
    ports:
      - "8382:6379"
    networks:
      - scrapeit
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5
  browser:
      container_name: headless-shell
      image: chromedp/headless-shell
      ports:
        - "9222:9222"
      networks:
        - scrapeit
      healthcheck:
        test: ["CMD", "wget", "--no-verbose", "--tries=3", "--spider", "http://localhost:9222/json/version"]
        interval: 30s
        timeout: 5s
        retries: 3
      restart: unless-stopped

  dev:
    container_name: scrapeit-dev
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    env_file:
      - .env
    ports:
      - "8380:8080"
      - "8381:7654"
    volumes:
      - ./:/go/src/app/
    networks:
      - scrapeit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  publisher:
    container_name: scrapeit-publisher
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      target: publisher
    env_file:
      - .env
    ports:
      - "8380:8080"
      - "8381:7654"
    networks:
      - scrapeit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
  subscriber:
    #container_name: scrapeit-client
    build:
      context: .
      dockerfile: Dockerfile
      target: subscriber
    env_file:
      - .env
    deploy:
      mode: replicated
      replicas: 2
    networks:
      - scrapeit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

networks:
  scrapeit:
