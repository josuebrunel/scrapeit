services:
  browser:
      container_name: scrapeit-browser
      image: chromedp/headless-shell
      ports:
        - "8387:9222"
      networks:
        - scrapeit
      healthcheck:
        test: ["CMD", "wget", "--no-verbose", "--tries=3", "--spider", "http://localhost:9222/json/version"]
        interval: 30s
        timeout: 5s
        retries: 3
      restart: unless-stopped
  ipfs:
    container_name: scrapeit-ipfs
    image: ipfs/go-ipfs
    ports:
      - 4001:4001/tcp
      - 4001:4001/udp
      - "8383:8080"
      - "8384:5001"
    environment:
      - IPFS_PATH=/data/ipfs
    networks:
      - scrapeit

  blockchain:
    container_name: scrapeit-blockchain
    image: romangzz/anvil
    ports:
      - "8385:8545"
    environment:
      - CHAIN_ID=42
      - BALANCE=100
      - BLOCK_TIME=15
      - HOST=0.0.0.0
      # - DISABLE_CODE_SIZE_LIMIT=true
    volumes:
      - ./contract:/contract
    networks:
      - scrapeit
  db:
    image: postgres
    container_name: scrapeit-db
    env_file:
      - .env
    volumes:
      - scrapeit_db:/var/lib/postgresql/data
      - ./init-scripts/db:/docker-entrypoint-initdb.d
    ports:
      - "8382:5432"
    networks:
      - scrapeit
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10
  auth:
    image: supabase/auth:v2.170.0
    container_name: scrapeit-auth
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8386:9999"
    networks:
      - scrapeit
    post_start:
      - command: ["gotrue", "admin", "createuser",  "--admin",  "--confirm", "admin",  "admin1234", "service_role"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3

  dev:
    container_name: scrapeit-dev
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    env_file:
      - .env
    ports:
      - "8380:8080"
      - "8381:7654"
    volumes:
      - ./:/go/src/app/
    networks:
      - scrapeit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      blockchain:
        condition: service_started
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      ipfs:
        condition: service_started


  publisher:
    container_name: scrapeit-publisher
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      target: publisher
    env_file:
      - .env
    ports:
      - "8380:8080"
      - "8381:7654"
    networks:
      - scrapeit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      ipfs:
        condition: service_started

  subscriber:
    container_name: scrapeit-subscriber
    build:
      context: .
      dockerfile: Dockerfile
      target: subscriber
    environment:
      - PUB_ROOT_PEERS=http://dev:8080/
      - CDP_REMOTE=ws://browser:9222/
      - API_KEY=B8lLeX66OGgK4rL2am9NQQSOO2kU8MryHBOjSQGP6O0
    networks:
      - scrapeit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      browser:
        condition: service_started
networks:
  scrapeit:

volumes:
  scrapeit_db:
